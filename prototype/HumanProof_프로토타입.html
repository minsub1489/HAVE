*, *::before, *::after { box-sizing: border-box; }

.shell {
  display: grid;

  min-height: 100vh;
}
.topbar {

}

}

.demo-pill { font-size: .74rem; color: var(--muted); background: var(--canvas); border: 1px solid var(--line); padding: 4px 9px; border-radius: 100px; white-space: nowrap; }
.role-control { display: inline-flex; align-items: center; gap: 3px; font-size: .84rem; }
.role-control select { font-weight: 700; border: 0; padding: 7px 4px; min-height: 44px; }
.avatar { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 50%; color: var(--accent); background: var(--accent-soft); font-size: .75rem; font-weight: 800; }

.sidebar { position: sticky; top: 0; min-height: calc(100vh - 68px); max-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; align-self: start; padding: 30px 16px 20px; background: #fcfafb; border-right: 1px solid var(--line); }
.side-label { margin: 0 10px 10px; font-size: .74rem; color: var(--muted); font-weight: 700; }
.nav { display: grid; gap: 4px; }
.nav button { width: 100%; min-height: 46px; padding: 9px 11px; display: flex; align-items: center; gap: 11px; text-align: left; border-radius: 9px; font-size: .86rem; font-weight: 650; color: var(--muted); }
.nav button:hover, .sidebar-reset:hover { background: #f4edf0; color: var(--ink); }

.sidebar-foot { padding-top: 13px; border-top: 1px solid var(--line); }
.local-note, .sidebar-reset { display: flex; align-items: center; gap: 8px; padding: 7px 9px; color: var(--muted); font-size: .76rem; }

.sidebar-reset { width: 100%; min-height: 44px; border-radius: 8px; text-align: left; }

.main { min-width: 0; width: 100%; max-width: 1450px; margin: 0 auto; padding: 36px var(--content-padding) 24px; }
.page-heading, .work-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 26px; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(266px, 29%); gap: 20px; align-items: start; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #dad0d6; border-radius: 8px; background: var(--surface); min-height: 44px; padding: 8px 14px; text-decoration: none; font-weight: 750; font-size: .83rem; line-height: 1.4; text-align: center; }
.btn:not(:disabled):hover { border-color: #baa9b4; background: #faf4f7; }
.btn.primary { color: white; border-color: var(--accent); background: var(--accent); }
.btn.primary:not(:disabled):hover { border-color: var(--accent-hover); background: var(--accent-hover); }
.btn.outline { color: var(--accent); border-color: #ceafbb; }
.btn.danger { color: var(--danger); border-color: #e5bdc2; }
.btn.danger:not(:disabled):hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.small { font-size: .78rem; padding: 5px 9px; }
.btn:disabled, .btn.primary:disabled { background: #f5f2f4; border-color: #e3dce1; color: #6c646c; }
.btn .icon { width: 16px; height: 16px; }
.icon-button { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 8px; }
.icon-button:hover { background: var(--canvas); }
.badge { display: inline-flex; align-items: center; flex: none; gap: 4px; padding: 3px 8px; border-radius: 100px; color: var(--muted); background: #f2eef1; font-size: .73rem; font-weight: 750; white-space: nowrap; }
.badge.purple { color: var(--accent); background: var(--accent-soft); }

.badge.orange { color: var(--warning); background: var(--warning-soft); }
.badge.red { color: var(--danger); background: var(--danger-soft); }

.document-preview {
  isolation: isolate;
  position: relative;
  display: grid;
  place-items: center;
  width: calc(100% - 36px);
  min-height: 235px;

}

.doc-sheet { display: flex; align-items: flex-start; flex-direction: column; gap: 11px; width: min(208px, 82%); min-height: 202px; padding: 18px; text-align: left; border: 1px solid #e6dce0; border-radius: 4px; background: #fff; box-shadow: 6px 7px 0 #e9dce2, 0 9px 25px #562a3e29; transform: rotate(-4deg); transition: transform .18s ease; }

.preview-open { position: absolute; display: flex; align-items: center; gap: 7px; right: 10px; bottom: 10px; padding: 8px 11px; border: 1px solid #e3d6dd; border-radius: 7px; background: #fff; color: var(--accent); font-size: .75rem; font-weight: 800; box-shadow: 0 2px 7px #562a3e16; }
.preview-open .icon { width: 14px; height: 14px; }
.document-meta { display: grid; gap: 12px; padding: 14px 19px 17px; }
.file-label { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.file-label > .icon { color: var(--accent); box-sizing: content-box; padding: 9px; border: 1px solid #f0e1e8; border-radius: 8px; background: #fbf2f6; }
.file-label > span { min-width: 0; overflow-wrap: anywhere; }
.file-label strong, .file-label .muted { display: block; }

.file-details { color: var(--muted); border-top: 1px solid var(--line); font-size: .81rem; }

.risk-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; color: var(--muted); font-size: .83rem; }
.risk-grid b { color: var(--ink); }
.evidence-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); font-size: .87rem; }
.work-progress, .recent-list, .plain-list, .timeline { padding: 0; margin: 0; list-style: none; }
.work-progress { display: grid; gap: 9px; margin-bottom: 17px; }
.work-progress li { display: grid; align-items: center; grid-template-columns: 25px minmax(0, 1fr) auto; gap: 7px; padding: 6px 0; font-size: .83rem; color: var(--muted); }

.recent-list { padding: 8px 18px 13px; }

.pdf-icon { display: grid; place-items: center; width: 40px; height: 43px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: .71rem; font-weight: 850; }
.work-title { margin-bottom: 5px; font-weight: 750; overflow-wrap: anywhere; }

.subsection { margin-top: 17px; padding-top: 17px; border-top: 1px solid var(--line); }
.hash { margin-top: 9px; padding: 10px 12px; border-radius: 7px; color: var(--ink); background: var(--canvas); }
.inline-note { color: var(--muted); font-size: .79rem; line-height: 1.55; margin-top: 7px; overflow-wrap: anywhere; }
.callout { display: flex; gap: 10px; padding: 13px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: .84rem; overflow-wrap: anywhere; }
.callout > .icon { margin-top: 2px; }
.callout b { display: block; }
.callout.warning { background: var(--warning-soft); color: var(--warning); }
.callout.success { background: var(--success-soft); color: var(--success); }

.gate-tabs { display: flex; justify-content: space-between; gap: 6px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.gate-tabs button { min-height: 47px; padding: 6px 8px; border-bottom: 2px solid transparent; color: var(--muted); font-size: .83rem; }
.gate-tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 800; }
.task-prompt { margin: 13px 0 17px; padding: 15px; border: 1px solid #efe1e7; border-radius: 8px; background: #faf4f7; font-size: .88rem; }

.field { display: flex; flex-direction: column; gap: 7px; margin: 14px 0; min-width: 0; }
.field > span, .field > label { font-size: .84rem; font-weight: 750; }
input, select, textarea { max-width: 100%; min-width: 0; color: var(--ink); background: var(--surface); border: 1px solid #a99ba7; border-radius: 7px; padding: 9px 10px; }
textarea { width: 100%; min-height: 124px; resize: vertical; font-size: .88rem; line-height: 1.65; }
textarea[readonly], input[readonly] { background: #faf8f9; }
input[type="checkbox"], input[type="range"] { accent-color: var(--accent); }
.confidence { display: flex; gap: 14px; align-items: center; font-size: .88rem; }
.confidence input { flex: 1; }
.confidence b { color: var(--accent); }
.check-row { display: flex; align-items: flex-start; gap: 9px; margin: 0 0 10px; padding: 5px 0; font-size: .83rem; line-height: 1.55; }

.eval-row { display: grid; grid-template-columns: minmax(100px, 150px) 1fr; gap: 10px; align-items: start; margin-top: 13px; }
.eval-row .field { margin: 0 0 8px; }
.answer-quote { margin-top: 11px; padding: 12px; border-radius: 7px; background: var(--canvas); font-size: .88rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.gate-result { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid #efe1e7; border-radius: 9px; background: #faf4f7; }
.gate-result .score { color: var(--accent); font-size: 1.45rem; font-weight: 800; }
.block-reasons { margin: 12px 0; color: var(--muted); font-size: .77rem; line-height: 1.6; }
.plain-list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .82rem; }
.plain-list li + li { margin-top: 9px; }

.receipt { overflow: hidden; }
.receipt-top { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 25px; color: white; background: #472234; }
.receipt-top .mark { color: #fff; background: #ffffff23; }
.receipt-top h2 { margin-top: 16px; font-size: 1.38rem; }
.receipt-symbol { display: grid; place-items: center; width: 50px; height: 50px; border: 1px solid #ffffff45; border-radius: 11px; }
.receipt-symbol .icon { width: 29px; height: 29px; }
.receipt-body { padding: 23px; }
.receipt-title { margin: 12px 0 19px; font-size: 1.34rem; overflow-wrap: anywhere; }
.review-note { margin-top: 8px; font-size: .88rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.receipt-scope { margin-top: 20px; }
.share-body { display: grid; justify-items: center; gap: 11px; text-align: center; }
#qrcode { display: grid; place-items: center; width: min(200px, 100%); aspect-ratio: 1; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: white; font-size: .8rem; }
#qrcode canvas, #qrcode img { max-width: 100%; height: auto; }

.public-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px max(18px, calc((100vw - 788px) / 2)); border-bottom: 1px solid var(--line); background: white; }
.public-wrap { width: min(100%, 824px); margin: 31px auto 0; padding: 0 18px 24px; }

.verify-upload { margin-top: 14px; }
.dropzone { display: grid; justify-items: center; gap: 8px; padding: 15px; border: 1px dashed #ab8d9b; border-radius: 9px; text-align: center; background: #fcf8fa; cursor: pointer; font-size: .88rem; }

.result-box { margin-top: 11px; padding: 12px 14px; border-radius: 8px; background: var(--canvas); font-size: .85rem; overflow-wrap: anywhere; }
.result-box.green { background: var(--success-soft); color: var(--success); }
.result-box.red { background: var(--danger-soft); color: var(--danger); }
.demo-tools h3 { font-size: .78rem; color: var(--muted); margin-bottom: 7px; }

.version-row { display: flex; justify-content: space-between; align-items: center; gap: 11px; padding: 15px 19px; overflow-wrap: anywhere; }

.event h3 { font-size: .82rem; }
.event p { font-size: .76rem; color: var(--muted); margin-top: 3px; }
.review-round { padding: 10px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }

dialog { max-width: 600px; width: calc(100% - 32px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: white; color: var(--ink); box-shadow: 0 15px 50px #2820283b; }
dialog::backdrop { background: #28162279; }
.modal-head { padding: 9px 12px 9px 21px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.modal-body { max-height: 75vh; padding: 15px 21px 21px; overflow-y: auto; }
.modal-body p { color: var(--muted); font-size: .85rem; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
.modal-body .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.error-text { color: var(--danger); font-size: .82rem; }
.pdf-dialog { max-width: 970px; }
.pdf-dialog .modal-body { padding: 9px 13px 13px; }
.preview-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-bottom: 6px; font-size: .83rem; overflow-wrap: anywhere; }
.preview-toolbar .btn { flex: none; }
.pdf-viewer { display: block; width: 100%; height: min(62vh, 650px); border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); }
.pdf-viewer p { padding: 14px; }
.empty { padding: 32px 22px; text-align: center; }
.empty > .icon { width: 31px; height: 31px; color: var(--accent); margin-bottom: 10px; }
.empty p { color: var(--muted); margin: 8px 0 14px; font-size: .87rem; }
#toast { position: fixed; z-index: 100; bottom: 20px; left: 50%; width: max-content; max-width: 90vw; padding: 10px 16px; border-radius: 8px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; background: var(--ink); color: #fff; font-size: .83rem; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#storageStatus:not(:empty) { position: sticky; top: 0; z-index: 110; padding: 10px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 9px; color: var(--warning); background: var(--warning-soft); }
#storageStatus p { flex: 1; min-width: 200px; }

@media (max-width: 1080px) {
  :root { --sidebar-width: 177px; }
  .brand-button { padding-inline: 19px; }
  .version-row { flex-wrap: wrap; }
}
@media (max-width: 870px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .gate-layout .support-column { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .work-heading { flex-wrap: wrap; align-items: flex-start; }
  .btn.narrow-next { display: inline-flex; margin-bottom: 16px; }
  .btn.progress-action { display: none; }
  .work-progress { margin-bottom: 0; }
}
@media (max-width: 640px) {
  :root { --content-padding: 15px; }
  .shell { display: block; }
  .topbar { display: flex; justify-content: space-between; min-height: 61px; }
  .brand-button { min-height: 61px; padding-inline: 15px; border: 0; }
  .crumb, .sidebar-foot, .side-label { display: none; }
  .sidebar { position: static; min-height: auto; padding: 4px 9px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
  .nav button { flex-direction: column; justify-content: center; gap: 4px; min-height: 52px; padding: 4px 2px; font-size: .66rem; text-align: center; }
  .nav .icon { width: 16px; height: 16px; }
  .main { padding-top: 22px; }
  .page-heading, .work-heading { align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .split { gap: 14px; }
  .review-layout .support-column, .gate-layout .support-column { grid-template-columns: 1fr; }
  .work-row, .panel-head, .panel-foot, .panel-body { padding-inline: 13px; }
  .panel-foot { flex-wrap: wrap; }
  .document-preview { width: calc(100% - 24px); margin: 12px 12px 0; }
  .document-meta { padding-inline: 13px; }
  .gate-tabs { gap: 1px; padding-inline: 6px; }
  .gate-tabs button { font-size: .74rem; padding-inline: 5px; }
  .eval-row { grid-template-columns: 1fr; gap: 2px; }
  .receipt-body, .receipt-top { padding: 17px; }
  .detail-grid { gap: 12px; }
  .btn.mobile-reset { display: flex; width: fit-content; margin-top: 4px; }
  .public-wrap { margin-top: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media (max-width: 410px) {
  .public-wrap .detail-grid { grid-template-columns: 1fr; }
}
@media print {
  body { background: white; }
  .sidebar, .topbar, .skip-link, .page-heading, .support-column, .footer-note, #toast, #storageStatus { display: none !important; }
  .shell, .split { display: block; }
  .main { max-width: none; padding: 0; }
  .receipt { border: 0; }
  .receipt-top { print-color-adjust: exact; }
}

function nextWorkAction(v,approval){
 if(approval)return ['certificate',approval.revokedAt?'승인 기록 확인':'승인 증명서 보기'];
 if(gatesSubmitted(v))return ['review',role==='reviewer'?'검토 시작':'검토 상태 보기'];
 const label=role==='reviewer'?'과제 제출 상태 보기':v.returned?'답변 보완하기':v.gates.some(gate=>gate.submitted)?'답변 이어서 작성':'이해 과제 시작';
 return ['gate',label];
}
function nextWorkButton([target,label],classes){
 return `<button class="btn primary ${classes}" data-nav="${target}">${label} <span aria-hidden="true">→</span></button>`;
}
function workProgress(v,approval){
 const submitted=v.gates.filter(gate=>gate.submitted).length;
 const reviewStatus=approval?(approval.revokedAt?'철회':'승인 완료'):gatesPassed(v)?'평가 기준 충족':submitted===3?(v.gates.some(gate=>gate.evaluation)?'검토 중':'검토 대기'):'대기';
 const stages=[
  ['PDF 등록','완료',true],
  ['이해 과제',v.returned?'보완 요청':submitted+' / 3 제출',submitted===3],
  ['검토·승인',reviewStatus,!!approval],
  ['승인 증명서',approval?'발급 기록 있음':'미발급',!!approval]
 ];
 const currentStage=stages.findIndex(stage=>!stage[2]);
 return `<section class="panel">
  <div class="panel-head"><h2>작업 진행</h2><span class="badge">v${v.n}</span></div>
  <div class="panel-body">
   <ol class="work-progress">${stages.map(([label,status,done],index)=>`<li class="${done?'is-done':index===currentStage?'is-current':''}" ${index===currentStage?'aria-current="step"':''}>
    <span class="progress-marker" aria-hidden="true">${done?icon('check'):index+1}</span><span>${label}</span><span class="progress-status">${status}</span>
   </li>`).join('')}</ol>
   ${nextWorkButton(nextWorkAction(v,approval),'full-width progress-action')}
  </div>
 </section>`;
}
function riskPanel(v){

  <div class="panel-body"><div class="risk-grid">${riskLabels.map((label,i)=>`<span>${label}</span><b>${v.risk[i]} / ${riskMax[i]}</b>`).join('')}</div>

}

function approvalReasons(v){const reasons=[];if(storageProblem)reasons.push('저장 오류를 해결한 뒤 승인하세요.');if(role!=='reviewer')reasons.push('검토자 B 역할로 전환해야 합니다. 자기 승인은 금지됩니다.');if(!gatesSubmitted(v))reasons.push('세 과제의 답변을 모두 제출해야 합니다.');if(!v.gates.every(g=>g.evaluation?.reason.trim()))reasons.push('모든 과제에 점수와 평가 근거가 필요합니다.');if(totalScore(v)<5)reasons.push('총점 5 / 6점 이상이 필요합니다.');if(v.gates.some(g=>g.evaluation?.critical))reasons.push('치명 오류가 있는 과제의 재검토가 필요합니다.');if(!v.checks.every(Boolean))reasons.push('필수 체크리스트 4개를 모두 확인해야 합니다.');if(!v.memo.trim())reasons.push('최종 검토 근거를 입력해야 합니다.');if(approvalFor(v))reasons.push('이미 승인 기록이 있는 버전입니다. 새 버전을 등록해 주세요.');if(v.returned)reasons.push('수정 요청 후 답변을 다시 제출해야 합니다.');return reasons}

async function init(){

  $('#app').innerHTML=`<main class="public-wrap"><section class="panel empty"><h1>저장된 작업을 열 수 없습니다</h1><p>${esc(error.message)}</p><p>기존 기록은 자동 삭제하지 않았습니다. 백업을 먼저 저장한 뒤 초기화를 선택하세요.</p><button id="recoveryBackup" class="btn">기존 기록 백업</button><label class="check-row"><input id="resetConsent" type="checkbox">기존 기록을 새 샘플로 바꾸는 데 동의합니다</label><button id="recoveryReset" class="btn primary" disabled>새 샘플로 초기화</button></section></main>`;

function registerAgentTools(){if(!document.modelContext?.registerTool)return;const ctl=new AbortController();window.addEventListener('pagehide',()=>ctl.abort(),{once:true});const specs=[{name:'read_demo_work_status',title:'시연 작업 상태 조회',description:'현재 시연 작업의 버전, 과제 제출 상태, 승인 상태를 조회합니다. 비공개 답변은 반환하지 않습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('빈 객체를 전달하세요.');const v=current();return {version:v.n,status:statusOf(v)[0],submitted:v.gates.filter(g=>g.submitted).length,approvalAvailable:!!approvalFor(v)}}},{name:'navigate_demo_workflow',title:'시연 화면 이동',description:'HumanProof의 기존 화면으로 이동합니다. 답변 제출 또는 승인은 실행하지 않습니다.',inputSchema:{type:'object',properties:{screen:{type:'string',enum:['overview','gate','review','certificate','history']}},required:['screen'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||Object.keys(input).length!==1||!['overview','gate','review','certificate','history'].includes(input.screen))throw Error('올바른 screen을 전달하세요.');if(location.hash.startsWith('#verify='))history.replaceState(null,'',location.href.split('#')[0]);navigate(input.screen);return{screen}}}];for(const spec of specs){try{Promise.resolve(document.modelContext.registerTool(spec,{signal:ctl.signal})).catch(()=>{})}catch{}}}
