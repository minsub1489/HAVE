# jdbc 프로필 — PostgreSQL에 연결한다. 통합과 시연에 쓴다.
#   실행: ./gradlew bootRun --args='--spring.profiles.active=jdbc'
#   서버가 시작할 때 db/schema의 테이블을 만든다(이미 있으면 건너뜀).
# 지금은 스프링 부트가 아래 값으로 DataSource를 만든다. D3에서 DatabaseConnectionPool(싱글톤)이 만든 DataSource로 바꾼다.
spring:
  datasource:
    url: ${HAVE_DB_URL:jdbc:postgresql://localhost:5432/have}
    username: ${HAVE_DB_USER:have}
    password: ${HAVE_DB_PASSWORD:have}
  sql:
    init:
      mode: always
      schema-locations:        # 외래 키 순서대로. 파일을 더하면 여기에도 적는다
        - classpath:db/schema/01_user_work.sql
        - classpath:db/schema/02_version.sql
        - classpath:db/schema/03_review.sql
        - classpath:db/schema/04_approval.sql
        - classpath:db/schema/05_revision.sql
        - classpath:db/schema/06_audit.sql
