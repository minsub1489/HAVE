<rect x="330" y="946" width="840" height="136" rx="6" fill="#FFF8E1" stroke="#C9B26B"/>
<text x="346" y="970" font-size="13" fill="#172033">진행 순서(선행 조건) : UC01 → UC02 → UC03 → UC04 → UC06 → UC07 · UC08   |   수정 요청·반려 시 UC05 → UC04 재검토</text>
<text x="346" y="994" font-size="13" fill="#172033">UC10(승인 철회)은 승인 이후 언제든 가능하다. UC09는 모든 단계에서 조회할 수 있다. 승인 증명서 발급은 UC06 안에서 일어나는 시스템 동작이다.</text>
<text x="346" y="1018" font-size="13" fill="#172033">UC08을 제외한 모든 유스케이스는 로그인과 작업별 역할 확인(01 사용자·권한 관리)을 공통 선행 조건으로 한다.</text>
<text x="346" y="1042" font-size="13" fill="#172033">UC03은 위험 분석 → 검토자 지정·검토 요청 → 이해 확인 답변 제출까지를 한 유스케이스로 본다. (UC03 «include» UC04 등 잘못된 표기는 삭제)</text>
<text x="346" y="1066" font-size="13" fill="#172033">재제출(UC05)에서 근거자료·AI 사용 신고를 바꾸면 UC03의 이해 확인 답변을 다시 거친 뒤 UC04 재검토로 간다. (11-23)</text>
<text x="52" y="1172" font-size="12" fill="#526079">실선 = 액터와 유스케이스의 연관 · 빈 삼각형 = 액터 일반화 · 점선 화살표 = «extend»(조건이 맞을 때만 기본 유스케이스를 확장)</text>
